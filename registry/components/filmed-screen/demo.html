<!doctype html>
<html lang="en">
  <head>
    <title>Filmed Screen Demo</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .scene {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        padding: 180px 220px;
        color: #f4f4f5;
      }
      .scene h1 {
        font-size: 120px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .scene p {
        margin-top: 24px;
        font-size: 44px;
        color: #a1a1aa;
      }
      .tiles {
        display: flex;
        gap: 32px;
        margin-top: 96px;
      }
      .tile {
        width: 420px;
        padding: 32px;
        border-radius: 20px;
        background: #18181b;
        border: 2px solid #27272a;
      }
      .tile b {
        display: block;
        font-size: 72px;
        color: #fbbf24;
      }
      .tile span {
        font-size: 28px;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="filmed-screen-demo"
      data-start="0"
      data-duration="9"
      data-width="1920"
      data-height="1080"
    >
      <canvas
        class="hf-filmed-screen"
        layoutsubtree
        width="1920"
        height="1080"
        style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px"
      >
        <div
          class="hf-filmed-screen-scene"
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #0b0d12;
          "
        >
          <div class="scene">
            <h1 id="title">Filmed Screen</h1>
            <p id="sub">A HyperFrames component that films your scene.</p>
            <div class="tiles">
              <div class="tile" id="t1"><b id="n1">36</b><span>bokeh taps per pixel</span></div>
              <div class="tile" id="t2"><b id="n2">3 px</b><span>LED cell pitch</span></div>
              <div class="tile" id="t3"><b id="n3">0</b><span>overlays</span></div>
            </div>
          </div>
        </div>
      </canvas>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#title", { opacity: 0, y: 40, duration: 0.6 }, 0.2)
        .from("#sub", { opacity: 0, y: 24, duration: 0.6 }, 0.8)
        .from(".tile", { opacity: 0, y: 40, duration: 0.5, stagger: 0.25 }, 3.2)
        .to({}, { duration: 9 }, 0);
      window.__timelines["filmed-screen-demo"] = tl;
      tl.seek(0);
    </script>
    <!-- filmed-screen.html library, pasted as an author would -->
    <script>

            setTimeout(once, 250);
          }
          lenses.push({ prepare: prepare, draw: draw, afterPaint: afterPaint });
        }

        G.HFFilmedScreen = { mount: mount };
      })();
    </script>
    <script>
      HFFilmedScreen.mount({
        canvas: ".hf-filmed-screen",

              // Racks title → subtitle → title, so the catalog poster (t = 3 s) lands on the title.
              return document.getElementById(t < 1.4 || t >= 2.6 ? "title" : "sub");

          },

    </script>
